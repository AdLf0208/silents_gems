id = "silentgems"
name = "Silent's Gems"
version = "5.2.1"
description = """Silent's Gems for Horizon: the 21 gem items, the 21 storage blocks, the 84 ore blocks
with their overworld, nether and end generation, and the 84 redstone lamps (21 gems x off/on and
inverted off/on) that light while powered. Content and behaviour are one flat package."""
authors = ["SilentChaos512 (upstream)", "AdLf0208"]
# The one manifest and the only identity. `api` is exact.
api = "0.2"
side = "both"
# The shared value every manifest carries ("May add blocks, items, mob effects and entity types");
# this mod declares blocks and their block items.
capabilities = ["registries"]
license = "MIT"

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
