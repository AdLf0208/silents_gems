[package]
# Ported from: Silent's Gems 5.2.0 (SilentChaos512/SilentGems, MIT), Minecraft Java
# 26.2 NeoForge. Local-only until the maintainer approves publishing.
name = "silentgems"
version = "5.2.1"
edition = "2024"
license = "MIT"
description = "Silent's Gems for Horizon: gems, storage blocks, ores and redstone lamps"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command. The launcher builds against its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
